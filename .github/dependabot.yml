version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    # Exclude docs folder (Quarto-generated files)
    directories:
      - "/docs"
    open-pull-requests-limit: 0
